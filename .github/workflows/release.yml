name: release

# Push a tag like v0.1.0 to release. This runs the tests, creates the GitHub
# release, and updates the Homebrew formula in spicy-lemonade/homebrew-tap.
# Actions are pinned to commits, so a moved tag cannot change what runs.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # The tests run without write access. Only the release job below can
  # create the release.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The tag is put into the formula, so it must be only a version.
      - name: Check the tag is a version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "the tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH" >&2; exit 1; }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: make vet
      - run: make test
      - run: make e2e

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

      - name: Work out version and checksum
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          sha=$(curl -fsSL --retry 5 --retry-delay 3 "$url" | sha256sum | cut -d' ' -f1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The tap's token is not saved in its checkout. Only the push below
      # uses it.
      - name: Check out the tap
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: spicy-lemonade/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: false
          path: tap

      - name: Update the formula
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          mkdir -p tap/Formula
          sed -e "s/__VERSION__/${VERSION}/g" -e "s/__SHA256__/${SHA}/g" \
            -e '1,2d' packaging/homebrew/salt.rb > tap/Formula/salt.rb
          cd tap
          git config user.name "salt release"
          git config user.email "salt-release@users.noreply.github.com"
          git add Formula/salt.rb
          git commit -m "salt ${VERSION}"
          auth=$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD
