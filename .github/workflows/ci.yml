name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: make vet
      # Salt is only released for macOS and Linux, but must still build on
      # Windows, which has no flock, and on the other Unix systems that have
      # one. Some tests make named pipes, which Windows lacks, so only salt
      # itself is built.
      - name: build for Windows, Solaris and illumos
        if: matrix.os == 'ubuntu-latest'
        run: |
          GOOS=windows go build ./...
          GOOS=solaris go build ./...
          GOOS=illumos go build ./...
      - run: make test
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  e2e:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Linux runs the distribution's sqlite3. macOS runs Homebrew's, a
      # recent release, so a change in a new sqlite3 is caught.
      - name: make e2e
        if: runner.os != 'macOS'
        run: make e2e
      - name: make e2e with Homebrew's sqlite3
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install sqlite
          make e2e E2E_PATH="$(brew --prefix sqlite)/bin"
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: coverage-e2e.out
          flags: e2e
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
